name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 -f db/init/00_roles.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
